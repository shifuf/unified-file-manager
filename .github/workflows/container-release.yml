name: CI and publish container

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    env:
      MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
      MIRROR_USERNAME: ${{ secrets.MIRROR_USERNAME }}
      MIRROR_PASSWORD: ${{ secrets.MIRROR_PASSWORD }}
      MIRROR_IMAGE: ${{ secrets.MIRROR_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}-${{ matrix.target }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - name: Build and publish GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            UFM_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Optional China-accessible mirror. Configure these repository secrets to enable.
      - name: Login to configured mirror registry
        if: ${{ env.MIRROR_REGISTRY != '' && env.MIRROR_USERNAME != '' && env.MIRROR_PASSWORD != '' && env.MIRROR_IMAGE != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MIRROR_REGISTRY }}
          username: ${{ env.MIRROR_USERNAME }}
          password: ${{ env.MIRROR_PASSWORD }}
      - name: Push configured mirror tags
        if: ${{ env.MIRROR_REGISTRY != '' && env.MIRROR_USERNAME != '' && env.MIRROR_PASSWORD != '' && env.MIRROR_IMAGE != '' }}
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          test -n "$MIRROR_IMAGE"
          docker buildx imagetools create \
            --tag "$MIRROR_REGISTRY/$MIRROR_IMAGE-$TARGET:$VERSION" \
            "$IMAGE_NAME-$TARGET:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            docker buildx imagetools create --tag "$MIRROR_REGISTRY/$MIRROR_IMAGE-$TARGET:latest" "$IMAGE_NAME-$TARGET:$VERSION"
          fi
