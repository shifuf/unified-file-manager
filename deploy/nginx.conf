upstream ufm_api { server api:8080; keepalive 16; }
map $http_accept $ufm_public_html {
    default 0;
    ~*text/html 1;
}
map $uri $ufm_cache_control {
    default 'no-store';
    ~^/assets/ 'public, max-age=31536000, immutable';
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1g;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $ufm_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location ~ ^/(api/|d/|s/|fs/|lib/|dav/) {
        # HTML navigation reaches the SPA; JSON fetch and downloads reach API.
        # All public downloads stay uncached: signed/private objects never leak.
        if ($ufm_public_html) { rewrite ^/(s|fs|lib)/[^/]+$ /index.html last; }
        proxy_pass http://ufm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # Do not forward client-controlled chains from the public listener.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto ${UFM_PUBLIC_SCHEME};
        proxy_set_header X-Forwarded-Port '';
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Server;
    }
    location /assets/ { try_files $uri =404; }
    location = /index.html { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
