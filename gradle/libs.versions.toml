[versions]
springBoot = "3.3.13"
springDependencyManagement = "1.1.7"
mybatisPlus = "3.5.9"
freemarker = "2.3.33"
slf4j = "2.0.16"
flyway = "10.20.1"
postgresql = "42.7.4"
jjwt = "0.12.6"
springdoc = "2.6.0"
awsSdk = "2.29.45"
testcontainers = "1.20.4"
jieba = "1.0.2"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

[libraries.mybatis-plus-boot-starter]
module = "com.baomidou:mybatis-plus-spring-boot3-starter"
version.ref = "mybatisPlus"

[libraries.mybatis-plus-generator]
module = "com.baomidou:mybatis-plus-generator"
version.ref = "mybatisPlus"

[libraries.mybatis-plus-core]
module = "com.baomidou:mybatis-plus-core"
version.ref = "mybatisPlus"

[libraries.freemarker]
module = "org.freemarker:freemarker"
version.ref = "freemarker"

[libraries.slf4j-simple]
module = "org.slf4j:slf4j-simple"
version.ref = "slf4j"

[libraries.flyway-core]
module = "org.flywaydb:flyway-core"
version.ref = "flyway"

[libraries.flyway-postgresql]
module = "org.flywaydb:flyway-database-postgresql"
version.ref = "flyway"

[libraries.postgresql]
module = "org.postgresql:postgresql"
version.ref = "postgresql"

[libraries.jieba-analysis]
module = "com.huaban:jieba-analysis"
version.ref = "jieba"

[libraries.testcontainers-junit-jupiter]
module = "org.testcontainers:junit-jupiter"
version.ref = "testcontainers"

[libraries.testcontainers-postgresql]
module = "org.testcontainers:postgresql"
version.ref = "testcontainers"

[libraries.jjwt-api]
module = "io.jsonwebtoken:jjwt-api"
version.ref = "jjwt"

[libraries.jjwt-impl]
module = "io.jsonwebtoken:jjwt-impl"
version.ref = "jjwt"

[libraries.jjwt-jackson]
module = "io.jsonwebtoken:jjwt-jackson"
version.ref = "jjwt"

[libraries.springdoc-openapi]
module = "org.springdoc:springdoc-openapi-starter-webmvc-ui"
version.ref = "springdoc"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
