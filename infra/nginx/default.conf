map $http_x_forwarded_proto $proxy_x_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

proxy_cache_path /var/cache/nginx/ufm_public levels=1:2 keys_zone=ufm_public:32m
                 max_size=1g inactive=24h use_temp_path=off;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 220m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # HSTS is optional: set REQUIRE_HTTPS=true + put the real max-age here when the site is HTTPS-only.
  # Leaving it unset avoids breaking plain HTTP / IP access during early deploy.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # Stable file-ID URLs must reflect replacement, restoration and access changes.
  location /api/public/files/ {
    proxy_pass http://api:${APP_PORT}/api/public/files/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_cache off;
    proxy_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  # WebDAV shares the same nginx entrypoint. Keep uploads large and don't buffer
  # PROPFIND/GET bodies; pass the DAV verbs straight through to the API.
  location /api/dav/ {
    proxy_pass http://api:${APP_PORT}/api/dav/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header Destination $http_destination;
    proxy_hide_header X-Powered-By;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Cloud retrieval verifies the complete source before returning bytes or an
  # import result. Scope its longer budget to this administrator-only API.
  # The UI submits one source per request; API clients can submit up to 20.
  location ~ ^/api/storage-configs/[A-Za-z0-9_-]+/remote-files(?:/|$) {
    proxy_pass http://api:${APP_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_hide_header X-Powered-By;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 36600s;
    proxy_send_timeout 36600s;
  }

  # Full backups finish archive construction and remote confirmation before
  # returning a result. Keep their longer budget scoped to the admin API.
  location ~ ^/api/backups(?:/|$) {
    proxy_pass http://api:${APP_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_hide_header X-Powered-By;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location /api/ {
    proxy_pass http://api:${APP_PORT}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_hide_header X-Powered-By;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
