# 唯一 Compose 文件
# 全栈：docker compose --profile full up -d --build
# 依赖：docker compose up -d mysql redis
# 检索：docker compose --profile extras up -d
#
# 配置只读项目根 .env（见 .env.example，必改项很少）
# 数据卷：ufm_mysql_data / ufm_redis_data / ufm_meili_data / ufm_storage_data

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  mysql:
    image: mysql:8.4
    container_name: ufm-mysql
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unified_file_manager}
      MYSQL_USER: ${MYSQL_USER:-ufm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ufm_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    mem_limit: ${MYSQL_MEMORY_LIMIT:-512m}
    volumes:
      - ufm_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --binlog-row-image=${MYSQL_BINLOG_ROW_IMAGE:-MINIMAL}
      - --binlog-expire-logs-seconds=${MYSQL_BINLOG_EXPIRE_LOGS_SECONDS:-259200}
      - --max-binlog-size=${MYSQL_MAX_BINLOG_SIZE:-67108864}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: ufm-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ufm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ufm-meilisearch
    profiles: ["extras", "full"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ufm_meili_change_me}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MEILI_PORT:-7700}:7700"
    mem_limit: ${MEILI_MEMORY_LIMIT:-256m}
    volumes:
      - ufm_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ufm-api
    profiles: ["full"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ufm_meili_change_me}
      LOCAL_STORAGE_ROOT: /app/storage
      STORAGE_PLUGIN_DIR: /app/storage-plugins
      APP_PORT: ${APP_PORT:-60557}
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ufm_storage_data:/app/storage
      - ufm_plugin_data:/app/storage-plugins
      - ./backups:/app/backups
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-60557}:${APP_PORT:-60557}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const port=process.env.APP_PORT||'60557'; fetch('http://127.0.0.1:'+port+'/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  plugin-installer:
    profiles: ["plugins"]
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: plugin-installer
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    env_file:
      - .env
    environment:
      UFM_PLUGIN_API_URL: http://api:${APP_PORT:-60557}
      UFM_TOTP_CODE: ${UFM_TOTP_CODE:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ufm-web
    profiles: ["full"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-60558}:80"
    mem_limit: ${WEB_MEMORY_LIMIT:-64m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ufm_plugin_data:
    name: ufm_plugin_data
  ufm_mysql_data:
    name: ufm_mysql_data
  ufm_redis_data:
    name: ufm_redis_data
  ufm_meili_data:
    name: ufm_meili_data
  ufm_storage_data:
    name: ufm_storage_data
