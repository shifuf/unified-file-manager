# 唯一 Compose 文件
# 全栈：docker compose --profile full up -d --build
# 依赖：docker compose up -d mysql redis
# 检索：docker compose --profile extras up -d
#
# 配置只读项目根 .env（见 .env.example，必改项很少）
# 数据卷：ufm_mysql_data / ufm_redis_data / ufm_meili_data / ufm_storage_data

services:
  mysql:
    image: mysql:8.4
    container_name: ufm-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unified_file_manager}
      MYSQL_USER: ${MYSQL_USER:-ufm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ufm_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ufm_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: ufm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ufm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ufm-meilisearch
    profiles: ["extras", "full"]
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ufm_meili_change_me}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - ufm_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ufm-api
    profiles: ["full"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ufm_meili_change_me}
      LOCAL_STORAGE_ROOT: /app/storage
      APP_PORT: ${APP_PORT:-60557}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ufm_storage_data:/app/storage
    ports:
      - "${APP_PORT:-60557}:${APP_PORT:-60557}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const port=process.env.APP_PORT||'60557'; fetch('http://127.0.0.1:'+port+'/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ufm-web
    profiles: ["full"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-60558}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ufm_mysql_data:
    name: ufm_mysql_data
  ufm_redis_data:
    name: ufm_redis_data
  ufm_meili_data:
    name: ufm_meili_data
  ufm_storage_data:
    name: ufm_storage_data
