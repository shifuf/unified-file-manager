<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 - 统一文件管理</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #3b82f6;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>壳页面可离线打开，文件与 API 数据需要网络。请恢复连接后重试。</p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
