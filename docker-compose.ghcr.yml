# 国内服务器直接使用 GHCR 预构建镜像（无需在服务器上本地构建，几秒完成更新）
#
# 用法（在项目根目录）：
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull api web
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# 指定版本：在 .env 里加 UFM_VERSION=v0.1.0（默认 latest）
#
# 如果 ghcr.io 拉不动，把下面两处 ghcr.io 换成国内镜像源，三选一：
#   ghcr.nju.edu.cn                     （南京大学 ghcr 镜像）
#   docker.m.daocloud.io/ghcr.io       （DaoCloud ghcr 镜像）
#   ghcr.m.daocloud.io                 （DaoCloud 短地址）
services:
  api:
    image: ghcr.io/shifuf/unified-file-manager-api:${UFM_VERSION:-latest}
    pull_policy: always
  web:
    image: ghcr.io/shifuf/unified-file-manager-web:${UFM_VERSION:-latest}
    pull_policy: always
